name: MCP port native Windows runtime
on:
  push:
    branches: [verify/mcp-port-native-runtime]
permissions:
  contents: read
  actions: read
concurrency:
  group: mcp-port-native-runtime
  cancel-in-progress: false
jobs:
  native-ui:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Download exact successful Windows build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42782291324 --repo GenesisOnee/universe --name mcp-port-windows-validation --dir runtime-bin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -LiteralPath 'runtime-bin/Tari Universe (Alpha).exe' -Algorithm SHA256).Hash
          if ($hash -ne 'AFAA0E3534316B888BFB8A5E601AC8D5F234BF67AA9FDFB966F79AC3D9ADB2C5') { throw 'Unexpected build artifact' }
      - name: Install pinned UI driver
        run: npm install --prefix .runtime-driver --no-audit --no-fund --ignore-scripts @playwright/test@1.61.1
      - name: Run native app through real WebView2 UI
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'Existing administrative Windows runner required; no elevation bypass' }
          $env:TARI_NETWORK = 'esmeralda'
          node .github/scripts/mcp-port-native-runtime.mjs
          exit $LASTEXITCODE
      - name: Retain bounded runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-port-native-runtime-evidence
          path: runtime-evidence
          retention-days: 3
          if-no-files-found: warn
